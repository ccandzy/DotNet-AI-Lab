<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat transcript</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow-y: auto;
      background: #ffffff;
      color: #0d0d0d;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-size: 14px;
    }
    #messages { box-sizing: border-box; min-height: 100%; max-width: 720px; margin: 0 auto; padding: 20px 8px 12px; }
    .message-row { display: flex; margin: 10px 0; }
    .message-row.user { justify-content: flex-end; }
    .message-row.assistant { justify-content: flex-start; }
    .bubble {
      box-sizing: border-box;
      max-width: 92%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    /*  Codex: user prompt is a quiet gray block, assistant is plain text  */
    .user .bubble {
      background: #f7f7f8;
      color: #0d0d0d;
      padding: 10px 14px;
      border-radius: 14px;
      border-bottom-right-radius: 4px;
    }
    .assistant .bubble {
      background: transparent;
      color: #0d0d0d;
      padding: 0;
    }
    .message-content { line-height: 1.65; }
    .message-content > :first-child { margin-top: 0; }
    .message-content > :last-child { margin-bottom: 0; }
    .message-content p { margin: 6px 0; }
    .message-content h1, .message-content h2, .message-content h3, .message-content h4 {
      margin: 18px 0 8px;
      color: #0d0d0d;
      line-height: 1.35;
      font-weight: 600;
    }
    .message-content h1 { font-size: 1.3em; }
    .message-content h2 { font-size: 1.18em; }
    .message-content h3 { font-size: 1.08em; }
    .message-content ul, .message-content ol { margin: 6px 0; padding-left: 24px; }
    .message-content li { margin: 3px 0; }
    .message-content blockquote {
      margin: 10px 0;
      padding-left: 14px;
      border-left: 2px solid #d9d9de;
      color: #8e8e93;
    }
    .message-content pre {
      overflow: auto;
      margin: 10px 0;
      padding: 14px;
      border-radius: 10px;
      background: #f7f7f8;
      border: 1px solid #ececec;
    }
    .message-content code {
      font-family: "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: .9em;
    }
    .message-content :not(pre) > code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #f7f7f8;
      color: #0d0d0d;
    }
    .message-content table { width: 100%; margin: 10px 0; border-collapse: collapse; }
    .message-content th, .message-content td { padding: 8px 10px; border: 1px solid #ececec; text-align: left; }
    .message-content th { background: #f7f7f8; font-weight: 600; }
    .message-content img { max-width: 100%; height: auto; border-radius: 8px; }
    .message-content a { color: #0d0d0d; text-decoration: underline; text-underline-offset: 2px; }
    .message-sources {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ececec;
      color: #8e8e93;
      font-size: 12px;
    }
    .message-sources summary {
      width: fit-content;
      cursor: pointer;
      color: #0d0d0d;
      font-weight: 500;
      user-select: none;
    }
    .source-list { margin: 10px 0 0; padding-left: 24px; }
    .source-item { margin: 8px 0; padding-left: 4px; }
    .source-file { color: #0d0d0d; font-weight: 500; }
    .source-heading { margin-top: 3px; color: #8e8e93; }
    .source-meta { margin-top: 3px; color: #b0b0b5; }
    .source-similarity { margin-left: 12px; }
    .rag-notice {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #ececec;
      color: #b0b0b5;
      font-size: 11px;
    }
    .message-time {
      margin-top: 4px;
      color: #b0b0b5;
      font-size: 10px;
      line-height: 1;
      text-align: right;
    }
    #empty-state {
      display: flex;
      min-height: calc(100vh - 32px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #b0b0b5;
      text-align: center;
      gap: 12px;
    }
    #empty-state .mark {
      display: inline-flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      color: #fff;
      border-radius: 12px;
      font-family: Consolas, monospace;
      font-size: 15px;
    }
    #empty-state .hint { font-size: 15px; color: #8e8e93; }
    #empty-state .sub { font-size: 12px; color: #b0b0b5; }
  </style>
</head>
<body>
  <main id="messages" aria-live="polite"></main>
  <script>
    (() => {
      const container = document.getElementById('messages');
      const scrollElement = () => document.scrollingElement || document.documentElement;
      const isNearBottom = () => {
        const element = scrollElement();
        return element.scrollHeight - element.scrollTop - element.clientHeight < 64;
      };
      const scrollToBottom = () => requestAnimationFrame(() => {
        const element = scrollElement();
        element.scrollTop = element.scrollHeight;
      });
      const createSources = (sources, ragWasEnabled) => {
        if (!Array.isArray(sources) || sources.length === 0) {
          if (!ragWasEnabled) return null;
          const notice = document.createElement('div');
          notice.className = 'rag-notice';
          notice.textContent = '知识库未检索到相关内容';
          return notice;
        }

        const details = document.createElement('details');
        details.className = 'message-sources';
        const summary = document.createElement('summary');
        summary.textContent = `来源 (${sources.length})`;
        const list = document.createElement('ol');
        list.className = 'source-list';

        for (const source of sources) {
          const item = document.createElement('li');
          item.className = 'source-item';
          const file = document.createElement('div');
          file.className = 'source-file';
          file.textContent = source.fileName || '';
          file.title = source.sourcePath || '';
          const heading = document.createElement('div');
          heading.className = 'source-heading';
          heading.textContent = source.headingPath || '未命名章节';
          const meta = document.createElement('div');
          meta.className = 'source-meta';
          const lines = document.createElement('span');
          lines.textContent = `Lines ${source.startLine}-${source.endLine}`;
          const similarity = document.createElement('span');
          similarity.className = 'source-similarity';
          similarity.textContent = `Similarity ${Number(source.similarity).toFixed(2)}`;
          meta.append(lines, similarity);
          item.append(file, heading, meta);
          list.appendChild(item);
        }

        details.append(summary, list);
        return details;
      };
      const createMessage = (message) => {
        const row = document.createElement('article');
        row.className = `message-row ${message.role}`;
        row.dataset.messageId = message.id;

        const bubble = document.createElement('section');
        bubble.className = 'bubble';
        const content = document.createElement('div');
        content.className = 'message-content';
        content.innerHTML = message.contentHtml;
        const time = document.createElement('div');
        time.className = 'message-time';
        time.textContent = message.timestamp;

        const sources = createSources(message.sources, message.ragWasEnabled);
        bubble.append(content);
        if (sources) bubble.append(sources);
        bubble.append(time);
        row.appendChild(bubble);
        return row;
      };
      const showEmptyState = () => {
        const state = document.createElement('div');
        state.id = 'empty-state';
        const mark = document.createElement('span');
        mark.className = 'mark';
        mark.textContent = '>_';
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = '开始一段新的对话';
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = '在下方输入框描述你的问题';
        state.append(mark, hint, sub);
        container.replaceChildren(state);
      };

      window.chatTranscript = {
        setMessages(messages) {
          if (!messages || messages.length === 0) {
            showEmptyState();
          } else {
            container.replaceChildren(...messages.map(createMessage));
          }
          scrollToBottom();
        },
        appendMessage(message) {
          const follow = isNearBottom() || container.querySelector('#empty-state') !== null;
          const emptyState = container.querySelector('#empty-state');
          if (emptyState) container.replaceChildren();
          container.appendChild(createMessage(message));
          if (follow) scrollToBottom();
        },
        removeMessage(id) {
          const row = container.querySelector(`[data-message-id="${CSS.escape(id)}"]`);
          if (row) row.remove();
          if (container.childElementCount === 0) showEmptyState();
        },
        updateMessage(message) {
          const follow = isNearBottom();
          const row = container.querySelector(`[data-message-id="${CSS.escape(message.id)}"]`);
          const content = row?.querySelector('.message-content');
          if (!content) return;
          content.innerHTML = message.contentHtml;
          row.querySelector('.message-sources')?.remove();
          row.querySelector('.rag-notice')?.remove();
          const sources = createSources(message.sources, message.ragWasEnabled);
          const time = row.querySelector('.message-time');
          if (sources && time) time.before(sources);
          if (follow) scrollToBottom();
        }
      };
    })();
  </script>
</body>
</html>
