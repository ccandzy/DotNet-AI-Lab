<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat transcript</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow-y: auto;
      background: transparent;
      color: #203c44;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      font-size: 14px;
    }
    #messages { box-sizing: border-box; min-height: 100%; padding: 14px 18px; }
    .message-row { display: flex; margin: 5px 0; }
    .message-row.user { justify-content: flex-end; }
    .message-row.assistant { justify-content: flex-start; }
    .bubble {
      box-sizing: border-box;
      max-width: min(700px, 82%);
      padding: 10px 14px;
      border-radius: 9px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .user .bubble { background: #ddf0f0; color: #25454d; }
    .assistant .bubble { background: #fff; border: 1px solid #e0eaec; }
    .message-content { line-height: 1.6; }
    .message-content > :first-child { margin-top: 0; }
    .message-content > :last-child { margin-bottom: 0; }
    .message-content p { margin: 4px 0; }
    .message-content h1, .message-content h2, .message-content h3, .message-content h4 {
      margin: 12px 0 6px;
      color: #1d3e45;
      line-height: 1.35;
    }
    .message-content h1 { font-size: 1.25em; }
    .message-content h2 { font-size: 1.15em; }
    .message-content h3 { font-size: 1.08em; }
    .message-content ul, .message-content ol { margin: 4px 0; padding-left: 22px; }
    .message-content li { margin: 2px 0; }
    .message-content blockquote {
      margin: 8px 0;
      padding-left: 12px;
      border-left: 3px solid #b8d1d5;
      color: #557078;
    }
    .message-content pre {
      overflow: auto;
      margin: 8px 0;
      padding: 12px;
      border-radius: 6px;
      background: #eef4f5;
    }
    .message-content code {
      font-family: Consolas, "Courier New", monospace;
      font-size: .9em;
    }
    .message-content :not(pre) > code {
      padding: 1px 4px;
      border-radius: 4px;
      background: #eef4f5;
    }
    .message-content table { width: 100%; margin: 8px 0; border-collapse: collapse; }
    .message-content th, .message-content td { padding: 6px; border: 1px solid #cddde0; text-align: left; }
    .message-content th { background: #eef5f6; }
    .message-content img { max-width: 100%; height: auto; border-radius: 4px; }
    .message-content a { color: #27727c; }
    .message-sources {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e0eaec;
      color: #49666d;
      font-size: 12px;
    }
    .message-sources summary {
      width: fit-content;
      cursor: pointer;
      color: #27727c;
      font-weight: 600;
      user-select: none;
    }
    .source-list { margin: 8px 0 0; padding-left: 22px; }
    .source-item { margin: 7px 0; padding-left: 2px; }
    .source-file { color: #25454d; font-weight: 600; }
    .source-heading { margin-top: 2px; color: #557078; }
    .source-meta { margin-top: 2px; color: #788f96; }
    .source-similarity { margin-left: 10px; }
    .rag-notice {
      margin-top: 9px;
      padding-top: 7px;
      border-top: 1px solid #e0eaec;
      color: #8a999e;
      font-size: 11px;
    }
    .message-time { margin-top: 6px; color: #788f96; font-size: 12px; line-height: 1; text-align: right; }
    #empty-state {
      display: flex;
      min-height: calc(100vh - 28px);
      align-items: center;
      justify-content: center;
      color: #788f96;
      text-align: center;
    }
  </style>
</head>
<body>
  <main id="messages" aria-live="polite"></main>
  <script>
    (() => {
      const container = document.getElementById('messages');
      const scrollElement = () => document.scrollingElement || document.documentElement;
      const isNearBottom = () => {
        const element = scrollElement();
        return element.scrollHeight - element.scrollTop - element.clientHeight < 64;
      };
      const scrollToBottom = () => requestAnimationFrame(() => {
        const element = scrollElement();
        element.scrollTop = element.scrollHeight;
      });
      const createSources = (sources, ragWasEnabled) => {
        if (!Array.isArray(sources) || sources.length === 0) {
          if (!ragWasEnabled) return null;
          const notice = document.createElement('div');
          notice.className = 'rag-notice';
          notice.textContent = '知识库未检索到相关内容';
          return notice;
        }

        const details = document.createElement('details');
        details.className = 'message-sources';
        const summary = document.createElement('summary');
        summary.textContent = `来源 (${sources.length})`;
        const list = document.createElement('ol');
        list.className = 'source-list';

        for (const source of sources) {
          const item = document.createElement('li');
          item.className = 'source-item';
          const file = document.createElement('div');
          file.className = 'source-file';
          file.textContent = source.fileName || '';
          file.title = source.sourcePath || '';
          const heading = document.createElement('div');
          heading.className = 'source-heading';
          heading.textContent = source.headingPath || '未命名章节';
          const meta = document.createElement('div');
          meta.className = 'source-meta';
          const lines = document.createElement('span');
          lines.textContent = `Lines ${source.startLine}-${source.endLine}`;
          const similarity = document.createElement('span');
          similarity.className = 'source-similarity';
          similarity.textContent = `Similarity ${Number(source.similarity).toFixed(2)}`;
          meta.append(lines, similarity);
          item.append(file, heading, meta);
          list.appendChild(item);
        }

        details.append(summary, list);
        return details;
      };
      const createMessage = (message) => {
        const row = document.createElement('article');
        row.className = `message-row ${message.role}`;
        row.dataset.messageId = message.id;

        const bubble = document.createElement('section');
        bubble.className = 'bubble';
        const content = document.createElement('div');
        content.className = 'message-content';
        content.innerHTML = message.contentHtml;
        const time = document.createElement('div');
        time.className = 'message-time';
        time.textContent = message.timestamp;

        const sources = createSources(message.sources, message.ragWasEnabled);
        bubble.append(content);
        if (sources) bubble.append(sources);
        bubble.append(time);
        row.appendChild(bubble);
        return row;
      };
      const showEmptyState = () => {
        const state = document.createElement('div');
        state.id = 'empty-state';
        state.textContent = '开始一段新的对话吧';
        container.replaceChildren(state);
      };

      window.chatTranscript = {
        setMessages(messages) {
          if (!messages || messages.length === 0) {
            showEmptyState();
          } else {
            container.replaceChildren(...messages.map(createMessage));
          }
          scrollToBottom();
        },
        appendMessage(message) {
          const follow = isNearBottom() || container.querySelector('#empty-state') !== null;
          const emptyState = container.querySelector('#empty-state');
          if (emptyState) container.replaceChildren();
          container.appendChild(createMessage(message));
          if (follow) scrollToBottom();
        },
        removeMessage(id) {
          const row = container.querySelector(`[data-message-id="${CSS.escape(id)}"]`);
          if (row) row.remove();
          if (container.childElementCount === 0) showEmptyState();
        },
        updateMessage(message) {
          const follow = isNearBottom();
          const row = container.querySelector(`[data-message-id="${CSS.escape(message.id)}"]`);
          const content = row?.querySelector('.message-content');
          if (!content) return;
          content.innerHTML = message.contentHtml;
          row.querySelector('.message-sources')?.remove();
          row.querySelector('.rag-notice')?.remove();
          const sources = createSources(message.sources, message.ragWasEnabled);
          const time = row.querySelector('.message-time');
          if (sources && time) time.before(sources);
          if (follow) scrollToBottom();
        }
      };
    })();
  </script>
</body>
</html>
